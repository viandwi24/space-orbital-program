# Full checks off the laptops (ADR 0126).
# - Handover tags `ready/*` and `ready/prep-*`: the full suite on the tagged commit, then a result ref
#   `refs/ci/pass/<sha>` or `refs/ci/fail/<sha>` that Agent 1 reads with plain git before a merge.
# - Pushes to `main`: the full suite after each merge; a push that changes only docs runs docs:check.
# - Lint checks the whole tree (the one-time repo-wide format of ADR 0126 point 6 was done on 2026-10-18).
name: CI

on:
  push:
    branches: [main]
    tags: ['ready/**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to main cancels the older run; every handover tag keeps its own run.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
             && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="$(git merge-base origin/main HEAD)"
            # A tag on a commit already in main (or main itself): compare with its parent.
            if [ "$base" = "$(git rev-parse HEAD)" ]; then base="$(git rev-parse HEAD~1)"; fi
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$base" HEAD | grep -qvE '^(docs/|README\.md$|AGENTS\.md$|CLAUDE\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - run: bun run docs:check

  check:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - run: bun install --frozen-lockfile
      - name: lint
        run: bun run lint
      - name: generated web assets
        # Git-ignored outputs that `svelte-check` and the tests expect (laptops have them from earlier builds).
        run: |
          bun run --filter @orbital/web build:sandbox
          cd apps/web && bun scripts/copy-basis.ts
      # Each step keeps its output in a file; on failure the last lines go to the run's summary page,
      # which anyone can read without signing in (the raw job log needs a login).
      - name: typecheck
        run: |
          set -o pipefail
          bun run typecheck 2>&1 | tee /tmp/ci-typecheck.log
      - name: bun test
        run: |
          set -o pipefail
          bun run test 2>&1 | tee /tmp/ci-test.log
      - name: web vitest
        run: |
          set -o pipefail
          bun run --filter @orbital/web test 2>&1 | tee /tmp/ci-vitest.log
      - name: failure summary
        if: failure()
        run: |
          for f in typecheck test vitest; do
            [ -f /tmp/ci-$f.log ] || continue
            {
              echo "### $f: failing lines"
              echo '```'
              grep -nE '(✗|FAIL|fail\b|error|Error|ERROR|panic|Unhandled|exited with code [1-9])' /tmp/ci-$f.log | tail -n 60 || true
              echo '```'
              echo "### $f: last 80 lines"
              echo '```'
              tail -n 80 /tmp/ci-$f.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # the summary and the raw log need a login; an annotation does not (one per step: the tail)
            echo "::error title=$f tail::$(tail -n 40 /tmp/ci-$f.log | cut -c1-160 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          done
      - run: bun run build
      - name: e2e smoke (chromium, informational)
        # The runner has no GPU (software WebGL on 4 vCPU): a failure here is reported, not blocking.
        # Agent 1 runs the Chromium smoke on the M5 for plans that touch the web app or renderer.
        continue-on-error: true
        working-directory: apps/web
        run: |
          bunx playwright install --with-deps chromium
          E2E_PORT=5192 bunx playwright test --project=chromium e2e/smoke.e2e.ts
      - name: e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.sha }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  report:
    # The result of a handover or of a push to main, as a ref the coordinator can read with
    # `git ls-remote` (no gh, no API). Main pushes need it since merges stopped waiting for CI.
    needs: [scope, docs, check]
    if: always() && (startsWith(github.ref, 'refs/tags/ready/') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ "${{ needs.docs.result }}" = "success" ] && \
             { [ "${{ needs.check.result }}" = "success" ] || [ "${{ needs.check.result }}" = "skipped" ]; }; then
            result=pass
          else
            result=fail
          fi
          git push origin "$GITHUB_SHA:refs/ci/$result/$GITHUB_SHA"
          echo "CI $result for $GITHUB_REF_NAME at $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
